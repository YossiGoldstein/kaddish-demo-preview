  <body>
    <div id="root"></div>
    <script>
      // Set lang/dir before the first paint, so a Hebrew visitor never sees the page flip (same rule as src/i18n/index.js).
      (function () {
        var l = 'en';
        try { l = localStorage.getItem('kaddish-lang') || ''; } catch (e) {}
        if (!/^(en|he|es)$/.test(l)) {
          l = 'en';
          var ls = navigator.languages || [navigator.language || ''];
          for (var i = 0; i < ls.length; i++) {
            var b = String(ls[i]).toLowerCase().split('-')[0];
            if (b === 'he' || b === 'iw') { l = 'he'; break; }
            if (b === 'es') { l = 'es'; break; }
            if (b === 'en') break;
          }
        }
        document.documentElement.lang = l;
        document.documentElement.dir = l === 'he' ? 'rtl' : 'ltr';
      })();
    </script>
  </body>
